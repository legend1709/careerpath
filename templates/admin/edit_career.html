{% extends "base.html" %}

{% block title %}Edit Career - Admin - CareerPath{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <div class="admin-header">
            <h1>Edit Career: {{ career.title }}</h1>
            <a href="{{ url_for('admin_careers') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
        
        <form method="POST" class="career-form">
            <div class="form-group">
                <label for="title">Career Title *</label>
                <input type="text" id="title" name="title" value="{{ career.title }}" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category *</label>
                <input type="text" id="category" name="category" value="{{ career.category }}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" rows="4" required>{{ career.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="required_skills">Required Skills</label>
                <textarea id="required_skills" name="required_skills" rows="3">{{ career.required_skills }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="education">Education</label>
                <textarea id="education" name="education" rows="2">{{ career.education }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="job_roles">Job Roles</label>
                <textarea id="job_roles" name="job_roles" rows="3">{{ career.job_roles }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="salary_range">Salary Range</label>
                <input type="text" id="salary_range" name="salary_range" value="{{ career.salary_range }}">
            </div>
            
            <div class="form-group">
                <label for="growth">Career Growth</label>
                <textarea id="growth" name="growth" rows="2">{{ career.growth }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="icon">Font Awesome Icon Class</label>
                <input type="text" id="icon" name="icon" value="{{ career.icon }}">
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save"></i> Update Career
            </button>
        </form>
    </div>
</section>
{% endblock %}
